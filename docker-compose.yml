services:
  db:
    # pinned to match the import: PG17 + PostGIS 3.5 + pgRouting 3.7.3.
    # A dump from 17.x will not restore into an older major version.
    image: pgrouting/pgrouting:17-3.5-3.7.3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-password}
      POSTGRES_DB: osm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # bound to localhost so import_city.sh can run from the host without
    # exposing postgres to the internet
    ports:
      - "127.0.0.1:5454:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6363:6379"

  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGPASSWORD: ${PGPASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CITY: ${CITY:-berlin}
      MAX_MINUTES: ${MAX_MINUTES:-25}
      RATE_LIMIT: ${RATE_LIMIT:-60}
      IMPORT_LIMIT: ${IMPORT_LIMIT:-3}
      MAX_AREA_KM2: ${MAX_AREA_KM2:-30}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-4000}
    # no ports: reachable only through caddy
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sibling services (eudr, cbam) drop their own site block in here from
      # their own repos; on the server CADDY_SITES_DIR=/opt/caddy-sites, which
      # this stack's rsync --delete deploy never touches. Local dev uses the
      # tracked empty ./caddy-sites, so the import just matches nothing.
      - ${CADDY_SITES_DIR:-./caddy-sites}:/etc/caddy/sites:ro
      # Static files for the personal site, which capan/huseyincapan.dev owns
      # end to end: its repo ships the site block into the sites dir above and
      # rsyncs the built files into SITE_ROOT_DIR on the host. This stack only
      # has to make them visible inside the container. Read-only because Caddy
      # serves them and never writes; the host-side rsync is what writes.
      # Env-defaulted like CADDY_SITES_DIR so a Mac mounts the tracked empty
      # ./caddy-sites rather than an /opt path that does not exist there.
      - ${SITE_ROOT_DIR:-./caddy-sites}:/srv/site:ro
      # Access logs. The personal site's block writes JSON here and Caddy
      # rotates it; this stack only has to put the directory on the host so it
      # can be read over SSH, and so it survives the container being recreated.
      # NOT read-only, unlike the two mounts above: Caddy is the writer here.
      - ${CADDY_LOGS_DIR:-./caddy-logs}:/var/log/caddy
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
