services:
  db:
    # pinned to match the import: PG17 + PostGIS 3.5 + pgRouting 3.7.3.
    # A dump from 17.x will not restore into an older major version.
    image: pgrouting/pgrouting:17-3.5-3.7.3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-password}
      POSTGRES_DB: osm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # bound to localhost so import_city.sh can run from the host without
    # exposing postgres to the internet
    ports:
      - "127.0.0.1:5454:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6363:6379"

  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGPASSWORD: ${PGPASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CITY: ${CITY:-berlin}
      MAX_MINUTES: ${MAX_MINUTES:-25}
      RATE_LIMIT: ${RATE_LIMIT:-60}
    # no ports: reachable only through caddy
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
